services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sale
      POSTGRES_PASSWORD: sale
      POSTGRES_DB: flashsale
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sale -d flashsale"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    command: node server/index.js
    ports:
      - "3000:3000"
    environment: &app-env
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://sale:sale@postgres:5432/flashsale
      STOCK: "500"
      SKU: aether-x1
      RATE_LIMIT: "20"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: node server/worker.js
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
